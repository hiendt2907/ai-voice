apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-voice

resources:
  - namespace.yaml
  - config/configmap.yaml
  - config/externalsecret.yaml
  - config/redirect-middleware.yaml
  - data/postgres-statefulset.yaml
  - data/redis-deployment.yaml
  - data/minio-deployment.yaml
  - api/deployment.yaml
  - api/service.yaml
  - api/ingress.yaml
  - portal/deployment.yaml
  - portal/service.yaml
  - portal/ingress.yaml
  - voice/deployment.yaml
  - voice/service.yaml

# Jenkins (Jenkinsfile, "Update manifests" stage) rewrites the newTag fields
# below to the built git-sha and commits/pushes to Gitea after a successful
# Harbor push. ArgoCD (Application: ai-voice) then shows this as OutOfSync —
# sync is manual (matches the omni-core convention on this cluster), so a
# human always approves the actual rollout.
images:
  - name: harbor.harbor.svc.cluster.local/ai-voice/api
    newTag: 9eb7bc7
  - name: harbor.harbor.svc.cluster.local/ai-voice/portal
    newTag: 9eb7bc7
  - name: harbor.harbor.svc.cluster.local/ai-voice/voice
    newTag: 9eb7bc7
