apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: ai-voice
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  rules:
    - host: doctorcheck.ai-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 3000
