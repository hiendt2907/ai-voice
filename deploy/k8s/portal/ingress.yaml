apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: ai-voice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ai-voice-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: aivoice.asia
      http:
        paths:
          # Portal Simulator's browser-side WS client (same-origin, avoids
          # needing voice worker exposed anywhere) — see apps/portal/ws-proxy.js.
          - path: /ws/call
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 3000
  tls:
    - hosts:
        - aivoice.asia
      secretName: aivoice-asia-tls
