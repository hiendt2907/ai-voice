apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: ai-voice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      imagePullSecrets:
        - name: harbor-ai-voice-pull
      containers:
        - name: portal
          image: harbor.harbor.svc.cluster.local/ai-voice/portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ai-voice-config
            - secretRef:
                name: ai-voice-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
