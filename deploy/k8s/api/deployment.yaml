apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ai-voice/api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ai-voice-config
            - secretRef:
                name: ai-voice-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
