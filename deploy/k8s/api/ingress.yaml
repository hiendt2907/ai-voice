apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ai-voice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ai-voice-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.aivoice.asia
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
  tls:
    - hosts:
        - api.aivoice.asia
      secretName: api-aivoice-asia-tls
