# Lớp phòng thủ ở tầng ingress cho lỗ hổng /internal/* mở ra internet.
# Middleware chặn cứng: ipAllowList chỉ cho phép 127.0.0.1/32 đi qua, tức là
# KHÔNG một client internet thật nào khớp được → Traefik trả 403 cho mọi request.
# Đây là "deny-all" theo đúng cơ chế Traefik v3 (ipWhiteList đã deprecated).
# Các lời gọi nội bộ (voice worker → NestJS, NestJS tự gọi chính nó) đi thẳng
# qua Service DNS trong cluster (http://api:3001, xem config/configmap.yaml),
# KHÔNG đi qua ingress này, nên middleware này không ảnh hưởng tới chúng.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-deny-all
  namespace: ai-voice
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ai-voice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ai-voice-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.aivoice.asia
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
  tls:
    - hosts:
        - api.aivoice.asia
      secretName: api-aivoice-asia-tls
---
# Ingress riêng, path cụ thể hơn (/api/v1/internal) nên Traefik ưu tiên router
# này trước router "/" ở trên (path dài hơn = priority cao hơn theo mặc định
# của Traefik k8s Ingress provider); đặt thêm annotation priority tường minh
# để không phụ thuộc vào hành vi ngầm định. Mọi request khớp path này bị
# middleware internal-deny-all chặn ở bước routing, KHÔNG bao giờ tới được
# InternalController — đây là lớp phòng thủ độc lập với @UseGuards trong code,
# một lớp hỏng thì lớp còn lại vẫn chặn.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-internal-block
  namespace: ai-voice
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ai-voice-https-redirect@kubernetescrd,ai-voice-internal-deny-all@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  rules:
    - host: api.aivoice.asia
      http:
        paths:
          - path: /api/v1/internal
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
  tls:
    - hosts:
        - api.aivoice.asia
      secretName: api-aivoice-asia-tls
