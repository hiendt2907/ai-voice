apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice
  namespace: ai-voice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice
  template:
    metadata:
      labels:
        app: voice
    spec:
      containers:
        - name: voice
          image: ai-voice/voice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-voice-config
            - secretRef:
                name: ai-voice-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
