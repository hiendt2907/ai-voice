# Not Vault-managed like ai-voice-secrets (no Vault CLI access at the time
# this was created) — plain k8s Secret instead. Token expires periodically
# (seen ~3h lifetime); whoever refreshes it should:
#   kubectl create secret generic voip24h-secret -n ai-voice \
#     --from-literal=VOIP24H_TOKEN=<token> \
#     --from-literal=VOIP24H_EXTENSION=642 \
#     --dry-run=client -o yaml | kubectl apply -f -
# then roll the api deployment so it picks up the new value (envFrom does
# not hot-reload on Secret change).
apiVersion: v1
kind: Secret
metadata:
  name: voip24h-secret
  namespace: ai-voice
type: Opaque
stringData:
  VOIP24H_TOKEN: "PLACEHOLDER_SET_VIA_KUBECTL"
  VOIP24H_EXTENSION: "642"
