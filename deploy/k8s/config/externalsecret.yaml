# dataFrom.extract pulls every key present under the Vault path
# `secret/ai-voice-secrets` and injects it as an env var into pods that use
# `envFrom.secretRef: ai-voice-secrets` (see voice/api/portal deployment.yaml).
#
# Phase 0 (D4 — services/voice/inference_server.py auth) requires a new key:
#   INFERENCE_SERVER_TOKEN  — shared bearer token the voice worker (GCP) sends
#                             to the Macbook inference server over Tailscale.
#                             Must match the value the inference_server.py
#                             process on the Macbook is started with.
# This key must be added to Vault at secret/ai-voice-secrets by someone with
# Vault access — not added here, and not written by automation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-voice-secrets
  namespace: ai-voice
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ai-voice-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ai-voice-secrets
