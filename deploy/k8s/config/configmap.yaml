apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-voice-config
  namespace: ai-voice
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aivoice"
  REDIS_URL: "redis://redis:6379"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "recordings"
  API_PORT: "3001"
  VOICE_PORT: "8000"
  NESTJS_WEBHOOK_URL: "http://api:3001/api/v1/internal/call-events"
  API_INTERNAL_URL: "http://api:3001"
  NESTJS_URL: "http://api:3001"
  API_URL: "http://api:3001/api/v1"
  VOICE_WORKER_BASE_URL: "http://voice:8000"
  VOICE_WORKER_URL: "http://voice:8000"

  # LLM — xKiro cloud (OpenAI-compatible). Moved off the Macbook Ollama so the
  # Mac only has to run SIP + STT; the API key comes from the `ai-voice-xkiro`
  # secret, not from here.
  LLM_PROVIDER: "ollama"   # "ollama" == generic OpenAI-compatible client path
  LLM_BASE_URL: "https://api.xkiro.com/v1"
  # qwen/qwen3.5-flash trả 503 liên tục từ 2026-08-22 (endpoint /chat/completions;
  # /v1/models và TTS của xKiro vẫn bình thường → sự cố riêng của model này).
  # gemini-3.7-flash đo được 132-142ms/lượt, nhanh hơn hẳn qwen (1835-2318ms).
  LLM_MODEL: "google/gemini-3.7-flash"
  # Chuỗi dự phòng, thử theo đúng thứ tự khi model trước lỗi. Model hỏng bị
  # cầu dao tạm ngắt (llm/client.py) — 2 lỗi liên tiếp ngắt 120s, lỗi quyền
  # (403/404) ngắt 1800s — nên model chết không cộng thêm round-trip vào độ
  # trễ của mỗi lượt thoại.
  #
  # Danh sách đo thật ngày 2026-08-23 trên chính tài khoản xKiro này
  # (POST /v1/chat/completions, độ trễ lượt đầu chưa warm):
  #   gemini-3.7-flash 200 (warm ~132ms) | ministral-8b 200 557ms
  #   mistral-small-2603 200 1455ms      | kimi-k2.5 200 3203ms
  #   glm-5-turbo 200 7765ms             | grok-4.6 200 6403ms
  #   qwen3.5-flash 503 (chết từ 22/08)  | gemini 3.6/3/2.5 403 (cần trả phí)
  # z-ai/glm-4.6 CỐ Ý LOẠI: trả HTTP 200 nhưng content RỖNG — thất bại ngầm.
  # qwen giữ ở cuối để tự dùng lại khi nhà cung cấp khôi phục.
  LLM_FALLBACK_MODELS: "mistralai/ministral-8b,mistralai/mistral-small-2603,moonshotai/kimi-k2.5,x-ai/grok-4.6,z-ai/glm-5-turbo,qwen/qwen3.5-flash"
  # Back ON (2026-08-21) — needed for the slot-recovery path added in
  # runtime/executor.py: a step whose transitions gate on a slot (not
  # intent) can get stuck reprompting forever when STT garbles a common
  # word ("hôm nay" → "hãy nay") and the regex extractor can't match. That
  # recovery path is itself gated on this flag. Vector NLU (P9, 242
  # examples) still runs first and handles intent classification with 0 LLM
  # calls in the common case; this only adds the full-conversation-context
  # LLM call as a fallback, not a replacement.
  USE_LLM_NLU: "true"

  # STT stays on the Macbook inference server (faster-whisper) over Tailscale —
  # xKiro has no speech-to-text endpoint (/v1/audio/transcriptions returns 404
  # and no audio model is listed), so this is the one piece that can't move.
  # TTS is xKiro cloud; no TTS model weights on GCP or the Mac any more.
  STT_ENGINE: "remote"
  TTS_ENGINE: "xkiro"
  USE_REAL_TTS: "true"
  # OFF on GCP live (kubectl patch, 2026-08-20) — turned back off after the
  # round-1-4 canary above. A/B on the same audio file (see memory
  # streaming-stt-canary-enabled) proved Whisper hallucinates YouTube
  # phrases during silence gaps at confidence 0.73 in streaming mode —
  # false barge-ins + garbage fed to NLU. One-shot STT had zero
  # hallucinations on the same test. Do NOT re-enable without first gating
  # silence out of the streaming buffer before it reaches Whisper (VAD gate
  # at the streaming layer, not just AudioPipeline), proven again with the
  # --wav silence-gap test in CLAUDE.md.
  USE_STREAMING_STT: "false"
  # Canary (2026-08-20): Silero VAD (stt/silero_vad.py, onnxruntime-only)
  # replacing bare RMS energy — validated with real recorded speech
  # (pytest, silence ~0.02 vs speech ~0.9-1.0 probability) and confirmed
  # the GCP image boots clean with it enabled. Same rollout posture as
  # USE_STREAMING_STT above — watch for VAD-driven regressions (missed
  # end-of-utterance, barge-in not firing) and flip back on any sign of one.
  USE_SILERO_VAD: "true"
  ELEVENLABS_VOICE_ID: "d5HVupAWCwe4e6GvMCAL"
  ELEVENLABS_MODEL_ID: "eleven_v3"

  # xKiro — TTS voice/model and the LLM endpoint share one account; only
  # XKIRO_API_KEY is secret (k8s secret `ai-voice-xkiro`).
  XKIRO_TTS_URL: "https://api.xkiro.com/v1/audio/speech"
  XKIRO_VOICE: "gentle-female-vietnamese"
  XKIRO_MODEL: "xkiro-voice"

  # CloudFone ODS — still pending real schema, mock mode
  USE_REAL_ODS: "false"

  # Escalation "bác sĩ gọi lại" qua Telegram (services/voice/call/handoff.py,
  # settings.telegram_bot_token / settings.telegram_group_id trong
  # api/config.py — pydantic-settings map thẳng từ 2 biến này).
  # ĐANG ĐỂ TRỐNG CÓ CHỦ ĐÍCH: chưa có bot Telegram thật nào được cấp cho hệ
  # thống này. Không được đoán/tạo giá trị giả — token giả sẽ khiến handoff.py
  # tưởng đã cấu hình xong rồi gọi Telegram API thất bại âm thầm (best-effort,
  # xem call/handoff.py:79), còn nguy hiểm hơn im lặng bỏ qua như hiện tại.
  # Người vận hành cần cung cấp:
  #   - TELEGRAM_BOT_TOKEN: token bot thật (từ @BotFather), nên cân nhắc đưa
  #     vào k8s Secret (vd. ai-voice-secrets) thay vì ConfigMap dạng plaintext
  #     một khi có giá trị thật — ConfigMap không mã hoá at-rest.
  #   - TELEGRAM_GROUP_ID: id nhóm/chat Telegram nơi bác sĩ trực nhận thông báo.
  # Có thể set qua Portal (Settings → Notify, bảng notify_settings) — giá trị
  # đó được remote_config.py ưu tiên hơn nếu tồn tại; 2 biến dưới đây chỉ là
  # phương án dự phòng khi bảng notify_settings vẫn rỗng.
  # Token/chat id thật nạp từ Vault (secret/ai-voice-secrets) qua ExternalSecret;
  # secretRef đứng SAU configMapRef trong deployment nên giá trị Vault thắng.
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_GROUP_ID: ""

  # Base URL công khai để dựng link trả lời trong thông báo Telegram.
  # ĐỂ TRỐNG CÓ CHỦ ĐÍCH: hiện chưa có route public nào tới /callbacks của voice
  # worker (ingress chỉ expose portal + api), và endpoint đó là POST nên nút
  # inline dạng url bấm vào cũng chỉ ra 405. Điền URL nội bộ vào đây sẽ khiến
  # Telegram trả 400 "Wrong HTTP URL" và mất TOÀN BỘ thông báo. Trống = gửi tin
  # nhắn trơn, bác sĩ vẫn nhận được câu hỏi để gọi lại cho khách.
  PUBLIC_CALLBACK_BASE_URL: ""
