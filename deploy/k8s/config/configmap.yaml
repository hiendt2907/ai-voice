apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-voice-config
  namespace: ai-voice
data:
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aivoice"
  REDIS_URL: "redis://redis:6379"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "recordings"
  API_PORT: "3001"
  VOICE_PORT: "8000"
  NESTJS_WEBHOOK_URL: "http://api:3001/api/v1/internal/call-events"
  API_INTERNAL_URL: "http://api:3001"
  NESTJS_URL: "http://api:3001"
  API_URL: "http://api:3001/api/v1"
  VOICE_WORKER_BASE_URL: "http://voice:8000"
  VOICE_WORKER_URL: "http://voice:8000"

  # LLM — xKiro cloud (OpenAI-compatible). Moved off the Macbook Ollama so the
  # Mac only has to run SIP + STT; the API key comes from the `ai-voice-xkiro`
  # secret, not from here.
  LLM_PROVIDER: "ollama"   # "ollama" == generic OpenAI-compatible client path
  LLM_BASE_URL: "https://api.xkiro.com/v1"
  LLM_MODEL: "qwen/qwen3.5-flash"
  USE_LLM_NLU: "true"

  # STT stays on the Macbook inference server (faster-whisper) over Tailscale —
  # xKiro has no speech-to-text endpoint (/v1/audio/transcriptions returns 404
  # and no audio model is listed), so this is the one piece that can't move.
  # TTS is xKiro cloud; no TTS model weights on GCP or the Mac any more.
  STT_ENGINE: "remote"
  TTS_ENGINE: "xkiro"
  USE_REAL_TTS: "true"
  # Canary (2026-08-20): streaming STT validated round 1-4, see memory
  # phase2-streaming-stt-not-ready — latency ≥ one-shot, crash not
  # reproducible on stable env, fallback-while-WS-down confirmed with real
  # audio. GCP is the only pre-production env (no live CloudFone traffic
  # yet), so enabling here IS the canary. Watch pod logs for "degrading to
  # HTTP" and error rate; flip back to "false" immediately on regression.
  USE_STREAMING_STT: "true"
  # Canary (2026-08-20): Silero VAD (stt/silero_vad.py, onnxruntime-only)
  # replacing bare RMS energy — validated with real recorded speech
  # (pytest, silence ~0.02 vs speech ~0.9-1.0 probability) and confirmed
  # the GCP image boots clean with it enabled. Same rollout posture as
  # USE_STREAMING_STT above — watch for VAD-driven regressions (missed
  # end-of-utterance, barge-in not firing) and flip back on any sign of one.
  USE_SILERO_VAD: "true"
  ELEVENLABS_VOICE_ID: "d5HVupAWCwe4e6GvMCAL"
  ELEVENLABS_MODEL_ID: "eleven_v3"

  # xKiro — TTS voice/model and the LLM endpoint share one account; only
  # XKIRO_API_KEY is secret (k8s secret `ai-voice-xkiro`).
  XKIRO_TTS_URL: "https://api.xkiro.com/v1/audio/speech"
  XKIRO_VOICE: "gentle-female-vietnamese"
  XKIRO_MODEL: "xkiro-voice"

  # CloudFone ODS — still pending real schema, mock mode
  USE_REAL_ODS: "false"
